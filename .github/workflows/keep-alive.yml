name: keep-alive

# Pings /health so the Render free tier doesn't spin down during office hours.
# Cron is UTC. WIB (UTC+7): 09:00 WIB = 02:00 UTC.
on:
  schedule:
    # Mon-Fri 09:00-17:00 WIB
    - cron: "*/10 2-9 * * 1-5"
    - cron: "0 10 * * 1-5"
    # Sat 09:00-15:00 WIB
    - cron: "*/10 2-7 * * 6"
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://spotify-extraction-app.onrender.com/health
