name: Deploy to Google App Engine

on:
  push:
    branches:
      - master  # Deploy when code is pushed to the master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: 'latest'

    - name: Create service account key file
      id: create_key_file
      run: |
        # Create a temporary file for the service account key
        echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > $HOME/gcloud-service-key.json

    - name: Authenticate to Google Cloud
      run: gcloud auth activate-service-account --key-file=$HOME/gcloud-service-key.json

    - name: Set GCP Project
      run: gcloud config set project main-nucleus-431709-v9  # Replace with your GCP project ID

    - name: Deploy to App Engine
      run: gcloud app deploy --quiet