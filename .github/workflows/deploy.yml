name: Deploy to Google App Engine

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: 'latest'

    - name: Create service account key file
      run: |
        echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" | base64 --decode > $HOME/gcloud-service-key.json
        if [[ ! -f $HOME/gcloud-service-key.json ]]; then
          echo "Failed to create service account key file."
          exit 1
        fi

    - name: Authenticate to Google Cloud
      run: gcloud auth activate-service-account --key-file=$HOME/gcloud-service-key.json

    - name: Set GCP Project
      run: gcloud config set project main-nucleus-431709-v9

    - name: Deploy to App Engine
      run: |
        gcloud app deploy --quiet --update-env-vars SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }},SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}