<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Info</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        form {
            display: inline-block;
            text-align: left;
            margin-top: 20px;
        }
        label {
            font-size: 18px;
        }
        input[type="url"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            color: white;
            background-color: #0056b3;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #003d7a;
        }
        button:disabled {
            background-color: #a9a9a9;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #0056b3;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: red;
            font-size: 16px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Enter Spotify Link</h1>
    <h2>(Song, Album, Playlist, Artist, Show, Episode)</h2>
    <form id="spotifyForm" action="/result" method="post">
        <label for="spotify_url">Paste URL Here:</label>
        <input type="url" id="spotify_url" name="spotify_url" placeholder="https://open.spotify.com/..." required>
        <button type="submit" onclick="clearErrorMessage()">Get Info</button>
    </form>
    <div id="spinner" class="spinner"></div>
    <div id="error-message" class="error-message">Invalid Spotify URL. Please try again.</div>

    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                document.getElementById('spotify_url').value = '';
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('error-message').style.display = 'none';
                enableButton(); // Ensure button is enabled on page show
            }
        });
    
        window.onload = function() {
            document.getElementById('spotify_url').value = '';
            document.getElementById('spinner').style.display = 'none';
        };
    
        document.getElementById('spotifyForm').addEventListener('submit', function(event) {
            var url = document.getElementById('spotify_url').value;
            var button = event.target.querySelector('button');
    
            if (!isValidSpotifyUrl(url)) {
                event.preventDefault();
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
                enableButton(); // Enable button if URL is invalid
            } else {
                document.getElementById('spinner').style.display = 'block';
                disableButton(button); // Disable button after click
            }
        });
    
        function isValidSpotifyUrl(url) {
            var regex = /^https:\/\/open\.spotify\.com(?:\/intl-[\w-]+)?\/(track|album|playlist|artist|show|episode)\/[A-Za-z0-9]{22}(?:\?.*)?$/;
            return regex.test(url);
        }
    
        function clearErrorMessage() {
            document.getElementById('error-message').style.display = 'none';
        }
    
        function disableButton(button) {
            button.disabled = true;
            button.innerHTML = "Processing..."; // Optional: change button text
        }
    
        function enableButton() {
            var button = document.querySelector('button[type="submit"]');
            button.disabled = false;
            button.innerHTML = "Get Info"; // Reset button text
        }
    </script>    
</body>
</html>
