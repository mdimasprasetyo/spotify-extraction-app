<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Info</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <style>
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            background: #ff4d4f;
            color: #fff;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(-10px);
            z-index: 9999;
}
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <h1>Enter Spotify Link</h1>
    <h2>(Song, Album, Playlist, Artist, Show, Episode)</h2>

    <form id="spotifyForm" action="/result" method="post" novalidate>
        <label for="spotify_url">Paste URL Here:</label>
        <input
            type="url"
            id="spotify_url"
            name="spotify_url"
            placeholder="open.spotify.com or spotify.link"
            required
            autocomplete="off"
        />
        <button type="submit" id="submitButton">Get Info</button>
    </form>

    <div id="spinner" class="spinner" style="display:none;"></div>
    <div id="toast"></div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages" style="display: none;">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <script>
        function resetForm() {
            document.getElementById('spotify_url').value = '';
            document.getElementById('spinner').style.display = 'none';
            enableButton();
        }

        function disableButton(button, text) {
            button.disabled = true;
            if (typeof text === 'string') button.innerHTML = text;
        }

        function enableButton() {
            const button = document.querySelector('button[type="submit"]');
            if (button) {
                button.disabled = false;
                button.innerHTML = 'Get Info';
            }
        }

        function isValidSpotifyUrl(url) {
            if (!url) return false;
            url = url.trim();

            if (url.toLowerCase().includes('youtube.com')) return true;

            if (/^https:\/\/spotify\.link\/[A-Za-z0-9]+$/.test(url)) return true;

            const regex = /^https:\/\/open\.spotify\.com(?:\/intl-[\w-]+)?\/(track|album|playlist|artist|show|episode)\/[A-Za-z0-9]{22}(?:\?.*)?$/;
            return regex.test(url);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast.hideTimeout);
            toast.hideTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function showError(message) {
            showToast(message || 'An error occurred. Please try again.');
        }

        window.addEventListener('pageshow', e => { if (e.persisted) resetForm(); });
        window.addEventListener('load', resetForm);

        document.getElementById('spotifyForm').addEventListener('submit', function (event) {
            event.preventDefault(); 

            const urlInput = document.getElementById('spotify_url');
            const url = urlInput.value.trim();
            const button = document.getElementById('submitButton');
            const spinner = document.getElementById('spinner');

            if (!isValidSpotifyUrl(url)) {
                showError('Invalid Spotify URL. Please enter a valid link.');
                resetForm();
                return;
            }

            if (url.toLowerCase().includes('youtube.com')) {
                spinner.style.display = 'block';
                disableButton(button, 'Opening YouTube...');
                window.location.href = url;
                return;
            }
            
            if (url.includes('spotify.link')) {
                disableButton(button, 'Expanding short link...');
            } else {
                disableButton(button, 'Processing...');
            }
            spinner.style.display = 'block';
            
            this.submit(); 
        });

        window.addEventListener("DOMContentLoaded", function () {
            const flashMessages = document.querySelectorAll(".flash-message");
            flashMessages.forEach(msg => {
                const message = msg.textContent.trim();
                if (message) showToast(message);
            });
        });

    </script>
</body>
</html>
